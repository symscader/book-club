<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f8dfe6" />
  <title>Книга месяца ♡</title>
  <style>
    :root{
      --bg:#fff8f5; --card:#fffdfb; --text:#49373d; --muted:#846d74;
      --line:#ead8dc; --pink:#c96e83; --pink2:#f5dce3; --sand:#f4d8b9;
      --sea:#b9dce0; --shadow:0 16px 42px rgba(102,71,80,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text); background:
      radial-gradient(circle at 10% 10%, #fce7ed 0 13%, transparent 14%),
      radial-gradient(circle at 90% 0%, #dff1f0 0 14%, transparent 15%),
      linear-gradient(180deg,#fffaf7,#fff5f4);
      font-family:Inter,ui-rounded,"Segoe UI",system-ui,sans-serif;
    }
    button,input{font:inherit}
    .wrap{max-width:900px;margin:auto;padding:24px 16px 50px}
    .hero{padding:26px 4px 18px;text-align:center}
    h1{margin:0;font:700 clamp(34px,8vw,58px)/1 Georgia,serif;color:#b85e75}
    .sub{max-width:620px;margin:12px auto 0;color:var(--muted);line-height:1.55}
    .pill{display:inline-block;margin-top:14px;padding:8px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:16px;box-shadow:var(--shadow)}
    .card h2{margin:0 0 14px;font-size:19px}
    .grid{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:9px}
    input{width:100%;min-height:46px;border:1px solid #dfcbd1;border-radius:14px;padding:11px 13px;background:#fff;color:var(--text);font-size:16px;outline:none}
    input:focus{border-color:#c96e83;box-shadow:0 0 0 3px #f7e3e8}
    button{min-height:46px;border:0;border-radius:14px;padding:10px 16px;font-weight:800;cursor:pointer}
    .primary{background:var(--pink);color:white}
    .soft{background:var(--pink2);color:#8f4e60}
    .books{display:grid;gap:11px}
    .book{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fffaf8}
    .book.winner{outline:2px solid #d5966f;background:#fff6e9}
    .book-title{font-weight:900;font-size:17px}
    .meta{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}
    .vote{display:flex;align-items:center;gap:8px}
    .count{min-width:32px;text-align:center;font-weight:900;font-size:20px}
    .status{color:var(--muted);font-size:14px;line-height:1.45}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .notice{min-height:22px;margin-top:10px;color:#a95369;font-size:14px}
    .empty{text-align:center;color:var(--muted);padding:24px 8px}
    .tiny{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.45}
    .heart{font-size:18px}
    .loader{padding:25px;text-align:center;color:var(--muted)}
    @media(max-width:720px){
      .grid{grid-template-columns:1fr}.book{grid-template-columns:1fr}.vote{justify-content:space-between}
      .card{padding:15px;border-radius:20px}.wrap{padding-inline:12px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Книга месяца ♡</h1>
      <p class="sub">Добавляем кандидатов, выбираем имя и голосуем за то, что будем читать вместе.</p>
      <div class="pill" id="poll-label">Загружаю голосование…</div>
    </section>

    <section class="card">
      <h2>Добавить книгу 📚</h2>
      <form id="book-form" class="grid">
        <input id="title" required maxlength="100" placeholder="Название книги" />
        <input id="author" maxlength="80" placeholder="Автор" />
        <input id="proposer" maxlength="50" placeholder="Кто предложил" />
        <button class="primary" type="submit">Добавить</button>
      </form>
      <div id="book-notice" class="notice" aria-live="polite"></div>
    </section>

    <section class="card">
      <div class="top">
        <h2>Голосование 🩷</h2>
        <span id="summary" class="status"></span>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;margin-bottom:14px">
        <input id="voter" maxlength="50" placeholder="Твоё имя / ник" />
        <button id="refresh" class="soft" type="button">Обновить</button>
      </div>
      <div id="books" class="books"><div class="loader">Загружаю книги…</div></div>
      <div id="vote-notice" class="notice" aria-live="polite"></div>
      <p class="tiny">Один человек = один голос. Если проголосовать повторно под тем же именем, выбор изменится.</p>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (() => {
    const $ = s => document.querySelector(s);
    const clean = s => String(s || '').trim().replace(/\s+/g,' ');
    const cfg = window.BOOK_CLUB_CONFIG || {};
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || cfg.supabaseUrl.includes('ВСТАВЬ')) {
      $('#books').innerHTML = '<div class="empty">Сначала заполни <b>config.js</b> данными Supabase ♡</div>';
      $('#poll-label').textContent = 'Нужна настройка Supabase';
      return;
    }

    const db = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    let poll = null, books = [], votes = [];

    async function load() {
      $('#books').innerHTML = '<div class="loader">Обновляю…</div>';

      const { data: polls, error: pe } = await db
        .from('polls')
        .select('*')
        .eq('is_active', true)
        .order('created_at', { ascending:false })
        .limit(1);

      if (pe || !polls || !polls.length) {
        $('#poll-label').textContent = 'Нет активного голосования';
        $('#books').innerHTML = '<div class="empty">Создай активный месяц в таблице <b>polls</b>.</div>';
        return;
      }
      poll = polls[0];
      $('#poll-label').textContent = poll.title || 'Текущий выбор';

      const [{data:b, error:be},{data:v,error:ve}] = await Promise.all([
        db.from('books').select('*').eq('poll_id',poll.id).order('created_at'),
        db.from('votes').select('*').eq('poll_id',poll.id)
      ]);
      if (be || ve) {
        $('#books').innerHTML = '<div class="empty">Не удалось загрузить данные. Проверь политики доступа в Supabase.</div>';
        return;
      }
      books = b || []; votes = v || [];
      render();
    }

    function render() {
      const counts = {};
      books.forEach(b => counts[b.id] = 0);
      votes.forEach(v => { if (counts[v.book_id] !== undefined) counts[v.book_id]++; });
      const max = Math.max(0, ...Object.values(counts));
      $('#summary').textContent = votes.length ? `Проголосовали: ${votes.length}` : 'Пока без голосов';

      if (!books.length) {
        $('#books').innerHTML = '<div class="empty">Пока ни одной книги. Кто будет первой? 👀</div>';
        return;
      }

      $('#books').innerHTML = '';
      books.forEach(b => {
        const row = document.createElement('div');
        row.className = 'book' + (max > 0 && counts[b.id] === max ? ' winner' : '');

        const info = document.createElement('div');
        const t = document.createElement('div');
        t.className = 'book-title';
        t.textContent = (max > 0 && counts[b.id] === max ? '👑 ' : '') + b.title;
        const m = document.createElement('div');
        m.className = 'meta';
        const bits = [];
        if (b.author) bits.push(b.author);
        if (b.proposer) bits.push('предложила: ' + b.proposer);
        m.textContent = bits.join(' · ') || 'Без дополнительных данных';
        info.append(t,m);

        const side = document.createElement('div');
        side.className = 'vote';
        const c = document.createElement('span');
        c.className = 'count';
        c.textContent = counts[b.id];
        const btn = document.createElement('button');
        btn.className = 'soft';
        btn.type = 'button';
        btn.textContent = 'Голосую';
        btn.addEventListener('click', () => voteFor(b.id));
        side.append(c,btn);

        row.append(info,side);
        $('#books').append(row);
      });
    }

    async function voteFor(bookId) {
      if (!poll) return;
      const voter = clean($('#voter').value);
      if (!voter) {
        $('#vote-notice').textContent = 'Сначала напиши своё имя или ник ♡';
        $('#voter').focus();
        return;
      }
      const existing = votes.find(v => v.voter_key === voter.toLowerCase());
      let res;
      if (existing) {
        res = await db.from('votes').update({ book_id:bookId, voter_name:voter }).eq('id',existing.id);
      } else {
        res = await db.from('votes').insert({ poll_id:poll.id, book_id:bookId, voter_name:voter, voter_key:voter.toLowerCase() });
      }
      if (res.error) {
        $('#vote-notice').textContent = 'Не получилось сохранить голос: ' + res.error.message;
        return;
      }
      $('#vote-notice').textContent = 'Голос сохранён 🩷';
      await load();
    }

    $('#book-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!poll) return;
      const title = clean($('#title').value), author = clean($('#author').value), proposer = clean($('#proposer').value);
      if (!title) return;
      const { error } = await db.from('books').insert({ poll_id:poll.id, title, author, proposer });
      if (error) {
        $('#book-notice').textContent = 'Не получилось добавить книгу: ' + error.message;
        return;
      }
      e.target.reset();
      $('#book-notice').textContent = 'Книга добавлена 📚';
      await load();
    });

    $('#refresh').addEventListener('click', load);
    load();
  })();
  </script>
</body>
</html>
